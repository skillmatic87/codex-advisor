name = "astra_advisor"
description = "Astra advisor for difficult coding decisions, unresolved bugs, and conflicting evidence; consulted automatically under the codex-advisor workflow."
model = "gpt-6-astra"
model_reasoning_effort = "high"
developer_instructions = """
